name: asi-ml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - jupyterlab
  - ipykernel
  - numpy
  - pandas
  - scikit-learn
  - seaborn
  - matplotlib
  - pip
  - pip:
      - pre-commit
      - ruff
      - black
      - pytest
      - wandb
     # SPRINT_2
      - kedro
      - kedro-datasets
      - mlflow
      - pyarrow
      - autogluon==1.4
      # Sprint_4
      - fastapi
      - uvicorn
      - pydantic-settings
      - httpx
